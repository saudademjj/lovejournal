<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>Love Journal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --surface: #0f0f0f;
            --text-main: #ffffff;
            --text-muted: #666666;
            --accent-glow: rgba(255, 255, 255, 0.15);
            --line-color: #1a1a1a;
            --neon-blue: #2b00ff;
            --neon-pink: #ff003c;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 999; opacity: 0.06;
            filter: url(#noiseFilter);
        }

        header {
            position: fixed; top: 0; width: 100%; height: 80px; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 3rem; box-sizing: border-box;
            mix-blend-mode: difference;
        }

        .nav-link {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px;
            color: #aaaaaa; text-decoration: none; margin-left: 2rem;
            transition: color 0.3s ease;
        }
        .nav-link:hover, .nav-link.active { color: #ffffff; }

        .brand {
            font-family: 'Space Grotesk', sans-serif; font-weight: 700;
            font-size: 1.2rem; letter-spacing: -1px; color: white;
            text-decoration: none;
        }

        .nest-badge {
            display: flex; align-items: center; gap: 10px;
            font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
            color: white; opacity: 0.7; transition: opacity 0.3s;
        }
        .nest-badge:hover { opacity: 1; }
        .nest-dot {
            width: 6px; height: 6px; background: var(--neon-pink); border-radius: 50%;
            box-shadow: 0 0 12px var(--neon-pink);
        }

        @media (max-width: 768px) {
            header { padding: 0 1.5rem; }
            .nav-link { margin-left: 1rem; }
        }

        .preloader {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 20%, #151515 0%, #000 60%);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: all;
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .preloader--hidden {
            opacity: 0;
            transform: translateY(-2vh);
            pointer-events: none;
        }

        .preloader-inner {
            position: relative;
            width: 1px;
            height: 160px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), rgba(255,255,255,0.35), rgba(255,255,255,0.02));
            overflow: visible;
        }

        .preloader-dot {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 14px;
            border-radius: 999px;
            background: var(--neon-pink);
            box-shadow:
                0 0 0 4px rgba(0,0,0,1),
                0 0 24px var(--neon-pink);
            animation: preloaderDot 1.4s ease-in-out infinite;
        }

        .preloader-label {
            position: absolute;
            top: 50%;
            left: 32px;
            transform: translateY(-50%);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #f5f5f5;
            opacity: 0.9;
        }

        @keyframes preloaderDot {
            0%   { top: 0%; opacity: 0; }
            10%  { opacity: 1; }
            50%  { top: 90%; }
            100% { top: 0%; opacity: 0; }
        }
        .hud-clock {
            display: flex;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #f5f5f5;
            opacity: 0.85;
            transition: opacity 0.25s ease;
            white-space: nowrap;
        }
        .hud-clock .hud-date {
            margin-right: 0.8rem;
        }
        .hud-clock.is-hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <svg style="display: none;">
        <filter id="noiseFilter">
            <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
        </filter>
    </svg>
    <div class="noise-overlay"></div>

    <div id="preloader" class="preloader">
        <div class="preloader-inner">
            <div class="preloader-dot"></div>
            <div class="preloader-label">JOURNAL.</div>
        </div>
    </div>

    <header>
        <a href="{{ url_for('index') }}" class="brand">JOURNAL.</a>

    <!-- 右侧：HUD 时间 + 导航 + Nest -->
        <div style="display:flex; align-items:center; gap: 2rem;">
            <!-- 新增：右上角当前时间 HUD -->
            <div id="hud-clock" class="hud-clock">
                <span class="hud-date"></span>
                <span class="hud-time"></span>
            </div>

        <!-- 原来的导航保持不变 -->
            <a href="{{ url_for('index') }}"
               class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">
                Journal
            </a>
            <a href="{{ url_for('anniversaries') }}"
               class="nav-link {% if request.endpoint == 'anniversaries' %}active{% endif %}">
                Timeline
            </a>
            <a href="{{ url_for('map_view') }}"
               class="nav-link {% if request.endpoint == 'map_view' %}active{% endif %}">
                Map
            </a>

            <div class="nest-badge" style="margin-left: 2rem;">
                <div class="nest-dot"></div>
                <span>NEST</span>
            </div>
        </div>
    </header>

    {% block content %}{% endblock %}

    <script>
        window.addEventListener('load', function () {
            const pre = document.getElementById('preloader');
            if (!pre) return;
            pre.classList.add('preloader--hidden');
            setTimeout(() => pre.remove(), 900);
        });
    </script>
</body>
</html>
