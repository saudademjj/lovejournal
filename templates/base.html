<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>Love Journal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-future: #00f2ff; /* 蓝色/青色 - 未来 */
            --accent-past: #ff0055;   /* 粉色/红色 - 过去 */
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.5);
        }
        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }
        /* 全局动态背景 */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: -1;
            background:
                radial-gradient(circle at 10% 20%, rgba(0, 242, 255, 0.06), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 85, 0.06), transparent 40%);
        }

        /* 顶部导航 */
        header {
            position: fixed; top: 0; width: 100%; height: 60px; z-index: 100;
            display: flex; justify-content: center; align-items: center; gap: 2rem;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            background: rgba(5,5,5,0.6);
        }
        .nav-link {
            color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 0.9rem;
            transition: 0.3s;
        }
        .nav-link.active { color: white; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .nav-link:hover { color: white; }
    </style>
</head>
<body>
    <div class="ambient-bg"></div>
    <header>
        <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">Timeline</a>
        <a href="{{ url_for('anniversaries') }}" class="nav-link {% if request.endpoint == 'anniversaries' %}active{% endif %}">Anniversaries</a>
    </header>
    {% block content %}{% endblock %}
</body>
</html>
