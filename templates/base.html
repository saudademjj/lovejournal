<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>我们的日记</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Pico.css as reset/base -->
    <link rel="stylesheet"
          href="https://unpkg.com/@picocss/pico@latest/css/pico.min.css">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", "SF Pro Display", "Segoe UI", system-ui, -apple-system, sans-serif;
        background: #0b0c11;
        color: #f2f4ff;
      }
      header {
        width: 100%;
        padding: 2rem 1.5rem 1rem;
        box-sizing: border-box;
      }
      main {
        width: 100%;
        box-sizing: border-box;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 style="margin: 0; font-weight: 800; letter-spacing: -0.02em;">我日记</h1>
      <p class="muted" style="margin-top: 0.4rem; color: rgba(255,255,255,0.7);">只在 Tailscale 小世界里开放的二人空间 💌</p>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
