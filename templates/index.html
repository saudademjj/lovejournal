{% extends "base.html" %}
{% block content %}
<style>
    main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 180px 2rem 200px;
        position: relative;
        z-index: 2;
    }

    html.modal-open,
    html.modal-open body {
        overflow: hidden;
    }

    /* 光标光晕 */
    .cursor-glow {
        position: fixed;
        width: 320px;
        height: 320px;
        background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, rgba(0,0,0,0) 70%);
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 1;
        mix-blend-mode: screen;
        transition: opacity 0.35s ease, transform 0.35s ease, background 0.35s ease;
        opacity: 0.85;
    }

    .cursor-glow--active {
        transform: translate(-50%, -50%) scale(1.1);
        background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0) 70%);
        opacity: 1;
    }

    @media (prefers-reduced-motion: reduce) {
        .cursor-glow { display: none; }
    }

    /* 顶部搜索 & 类型过滤 */
    .timeline-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        margin-bottom: 2rem;
    }

    .timeline-search {
        flex: 1;
        max-width: 360px;
        position: relative;
    }

    .timeline-search-input {
        width: 100%;
        padding: 0.6rem 0.9rem 0.6rem 2.4rem;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(5,5,5,0.8);
        color: #f5f5f5;
        font-family: 'Inter', sans-serif;
        font-size: 0.85rem;
        outline: none;
        transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    .timeline-search-input::placeholder {
        color: #666;
    }

    .timeline-search-input:focus {
        border-color: rgba(255,255,255,0.3);
        background: #090909;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
    }

    .timeline-search::before {
        content: '⌕';
        position: absolute;
        left: 0.9rem;
        top: 50%;
        transform: translateY(-50%);
        font-size: 0.78rem;
        color: #777;
        pointer-events: none;
    }

    .timeline-filters {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 0;
    }

    .filter-pill {
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(5,5,5,0.8);
        color: #b0b0b0;
        padding: 0.35rem 0.9rem;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.7rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
        opacity: 0.9;
        transition: color 0.25s ease, border-color 0.25s ease, background 0.25s ease, transform 0.25s ease;
    }

    .filter-pill.is-active {
        color: #ffffff;
        border-color: rgba(255,255,255,0.4);
        background: #101010;
        transform: translateY(-1px);
    }

    .filter-pill:hover {
        color: #ffffff;
        border-color: rgba(255,255,255,0.3);
    }

    /* 时间轴 Grid & 中轴线 */
    .timeline-grid {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 60px minmax(0, 1fr);
        column-gap: 0;
    }

    .timeline-axis {
        grid-column: 2;
        grid-row: 1 / -1;
        justify-self: center;
        width: 1px;
        position: relative;
        pointer-events: none;
        z-index: 0;
    }

    .timeline-axis::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
            to bottom,
            rgba(255,255,255,0.02),
            rgba(255,255,255,0.12),
            rgba(255,255,255,0.02)
        );
        opacity: 0.7;
        animation: axisBreath 5s ease-in-out infinite;
        transform-origin: center;
    }

    @keyframes axisBreath {
        0%, 100% { opacity: 0.4; transform: scaleY(1); }
        50%      { opacity: 1;   transform: scaleY(1.02); }
    }

    .timeline-row {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 60px minmax(0, 1fr);
        align-items: center;
        padding: 2.6rem 0;
        position: relative;
        z-index: 1;
    }

    .axis-cell {
        grid-column: 2;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* 轴心圆 */
    .axis-dot {
        position: relative;
        width: 16px;
        height: 16px;
        border-radius: 999px;
        background: transparent;
        cursor: pointer;
        transform: translateZ(0);
    }

    .axis-dot::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        border: 1px solid rgba(255,255,255,0.4);
        box-shadow:
            0 0 0 1px var(--bg),
            0 0 0 rgba(255,0,60,0);
        transition:
            border-color 0.35s cubic-bezier(0.19, 1, 0.22, 1),
            box-shadow 0.35s cubic-bezier(0.19, 1, 0.22, 1),
            transform 0.35s cubic-bezier(0.19, 1, 0.22, 1),
            opacity 0.3s ease;
        opacity: 0.9;
    }

    .axis-dot::before {
        content: '';
        position: absolute;
        inset: 4px;
        border-radius: inherit;
        background: rgba(255,255,255,0.7);
        box-shadow: 0 0 8px rgba(255,255,255,0.25);
        transition:
            background 0.35s cubic-bezier(0.19, 1, 0.22, 1),
            box-shadow 0.35s cubic-bezier(0.19, 1, 0.22, 1),
            transform 0.35s cubic-bezier(0.19, 1, 0.22, 1);
    }

    .timeline-row--active .axis-dot::after {
        border-color: var(--neon-pink);
        box-shadow:
            0 0 0 1px var(--bg),
            0 0 22px rgba(255,0,60,0.9);
        transform: scale(1.2);
    }

    .timeline-row--active .axis-dot::before {
        background: var(--neon-pink);
        box-shadow: 0 0 18px rgba(255,0,60,0.9);
        transform: scale(0.95);
    }

    .timeline-row:hover .axis-dot::after {
        border-color: var(--neon-pink);
        box-shadow:
            0 0 0 1px var(--bg),
            0 0 16px rgba(255,0,60,0.65);
    }

    /* 时间列 & 内容列 */
    .time-wrapper,
    .content-wrapper {
        display: flex;
        align-items: center;
        opacity: 0;
        transform: translateY(32px);
        will-change: opacity, transform;
    }

    .timeline-row.even .time-wrapper {
        grid-column: 1;
        justify-content: flex-end;
        padding-right: 2rem;
        text-align: right;
    }

    .timeline-row.even .content-wrapper {
        grid-column: 3;
        justify-content: flex-start;
        padding-left: 2rem;
        text-align: left;
    }

    .timeline-row.odd .content-wrapper {
        grid-column: 1;
        justify-content: flex-end;
        padding-right: 2rem;
        text-align: right;
    }

    .timeline-row.odd .time-wrapper {
        grid-column: 3;
        justify-content: flex-start;
        padding-left: 2rem;
        text-align: left;
    }

    .time-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.8rem;
        color: #8f8f8f;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        white-space: nowrap;
        transition: color 0.25s ease, opacity 0.25s ease, text-shadow 0.3s ease;
        opacity: 0.9;
    }

    .time-label span {
        opacity: 0.55;
        font-size: 0.7rem;
        margin-left: 8px;
    }

    .timeline-row--active .time-label {
        color: #f7f7f7;
        opacity: 1;
        text-shadow: 0 0 12px rgba(255,255,255,0.4);
    }

    .timeline-row--active .time-label span {
        opacity: 0.85;
    }

    /* 内容块 */
    .entry-card {
        position: relative;
        display: inline-flex;
        flex-direction: column;
        align-items: flex-start;
        max-width: 32rem;
        width: 100%;
        gap: 0.8rem;
    }

    .entry-body {
        font-family: 'Inter', sans-serif;
        font-size: 1rem;
        line-height: 1.8;
        color: #d6d6d6;
        font-weight: 300;
        letter-spacing: 0.01em;
        transition: color 0.3s ease;
        white-space: pre-wrap;
    }

    .timeline-row--active .entry-body {
        color: #f3f3f3;
    }

    .entry-location {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        color: #888;
        opacity: 0.95;
    }

    .timeline-row--active .entry-location {
        color: #bfbfbf;
    }

    .keydate-minimal {
        display: inline-flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.12rem;
    }

    .timeline-row.odd .keydate-minimal {
        align-items: flex-end;
    }

    .kd-title {
        font-family: 'Inter', sans-serif;
        font-size: 1rem;
        font-weight: 300;
        color: #d6d6d6;
        letter-spacing: 0.01em;
        transition: color 0.3s ease;
    }

    .timeline-row--active .kd-title {
        color: #f3f3f3;
    }

    .kd-number {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 4.3rem;
        font-weight: 700;
        line-height: 0.9;
        color: #ffffff;
        letter-spacing: -2px;
        margin-bottom: 0.1rem;
        animation: kdBreath 6s ease-in-out infinite;
    }

    .kd-meta {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.7rem;
        color: #8a8a8a;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        transition: color 0.3s ease;
    }

    .timeline-row--active .kd-meta {
        color: #b4b4b4;
    }

    @keyframes kdBreath {
        0%, 100% { text-shadow: 0 0 0 rgba(255,255,255,0); }
        50%      { text-shadow: 0 0 16px rgba(255,255,255,0.35); }
    }

    .photo-frame {
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 0.9rem;
        border: 1px solid rgba(255,255,255,0.08);
        position: relative;
        transition: border-color 0.4s ease, transform 0.6s ease;
        will-change: transform;
    }

    .photo-frame::after {
        content: '';
        position: absolute;
        inset: -20%;
        background:
            radial-gradient(circle at 12% 0%, rgba(255,255,255,0.06), transparent 40%),
            radial-gradient(circle at 90% 100%, rgba(255,255,255,0.05), transparent 55%);
        mix-blend-mode: soft-light;
        opacity: 0;
        transition: opacity 0.6s ease, transform 1.2s ease;
        transform: translate3d(-6%, 4%, 0) scale(1.04);
        pointer-events: none;
    }

    .photo-frame img {
        display: block;
        width: 100%;
        filter: grayscale(40%) brightness(0.9);
        transform: scale(1.02);
        transform-origin: center;
        transition:
            transform 1.1s cubic-bezier(0.16, 1, 0.3, 1),
            filter 0.6s ease;
        will-change: transform, filter;
    }

    .timeline-row--active .photo-frame {
        border-color: rgba(255,255,255,0.22);
        transform: translate3d(0, -2px, 0);
    }

    .timeline-row--active .photo-frame img {
        transform: scale(1.08);
        filter: grayscale(0%) brightness(1.04) contrast(1.04);
    }

    .timeline-row--active .photo-frame::after {
        opacity: 1;
        transform: translate3d(4%, -3%, 0) scale(1.07);
    }

    .photo-caption {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        color: #a0a0a0;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .photo-caption::before {
        content: '';
        width: 18px;
        height: 1px;
        background: #3a3a3a;
        flex-shrink: 0;
    }

    /* 删除 & 编辑按钮 */
    .btn-delete,
    .btn-edit {
        position: absolute;
        top: -10px;
        background: none;
        border: none;
        font-size: 1.1rem;
        color: #444;
        cursor: pointer;
        padding: 0;
        opacity: 0;
        transition:
            opacity 0.3s ease,
            color 0.3s ease,
            transform 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        z-index: 20;
    }

    .timeline-row.even .btn-delete { right: -30px; }
    .timeline-row.odd .btn-delete { left: -30px; }

    .timeline-row.even .btn-edit { right: -60px; }
    .timeline-row.odd .btn-edit { left: -60px; }

    .entry-card:hover .btn-delete,
    .entry-card:hover .btn-edit {
        opacity: 1;
        color: #888;
    }

    .timeline-row.even .entry-card:hover .btn-delete {
        transform: translateX(6px) rotate(90deg);
    }
    .timeline-row.odd .entry-card:hover .btn-delete {
        transform: translateX(-6px) rotate(90deg);
    }

    .btn-delete:hover {
        color: var(--neon-pink) !important;
    }

    .btn-edit:hover {
        color: #ffffff !important;
    }

    /* Dock 控制条 */
    .dock {
        position: fixed;
        bottom: 3rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 200;
    }

    .dock-inner {
        background: rgba(5,5,5,0.7);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 999px;
        padding: 0.9rem 2.1rem;
        display: flex;
        gap: 2.4rem;
        align-items: center;
        box-shadow: 0 30px 60px rgba(0,0,0,0.9);
    }

    .dock-btn {
        background: none;
        border: none;
        color: #b0b0b0;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 0.75rem;
        cursor: pointer;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        padding: 0;
        transition: color 0.25s ease, transform 0.25s ease, text-shadow 0.25s ease;
    }

    .dock-btn:hover {
        color: #ffffff;
        transform: translateY(-2px);
        text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }

    .miss-you-btn {
        color: var(--neon-pink);
        font-size: 1.2rem;
        padding: 0 0.5rem;
        opacity: 0.9;
    }

    .miss-you-btn:hover {
        transform: scale(1.15);
        filter: drop-shadow(0 0 9px var(--neon-pink));
    }

    /* Modal */
    .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.82);
        z-index: 998;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
        backdrop-filter: blur(8px);
    }

    .modal-backdrop.active {
        opacity: 1;
        pointer-events: all;
    }

    dialog {
        border: 1px solid #222;
        background: #050505;
        color: #fff;
        position: fixed;
        top: 50%;
        left: 50%;
        margin: 0;
        transform: translate(-50%, -40%) scale(0.95);
        opacity: 0;
        padding: 3rem;
        border-radius: 16px;
        box-shadow: 0 40px 80px #000;
        width: min(420px, calc(100vw - 3rem));
        max-height: min(540px, calc(100vh - 4rem));
        box-sizing: border-box;
        overflow-x: hidden;
        overflow-y: auto;
        z-index: 999;
    }

    dialog[open] {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
    }

    .modal-title {
        margin: 0 0 2rem;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 300;
        font-size: 1.4rem;
        letter-spacing: -1px;
    }

    .modal-close {
        position: absolute;
        top: 1.5rem;
        right: 1.5rem;
        background: none;
        border: none;
        color: #666;
        font-size: 1.5rem;
        cursor: pointer;
        padding: 0;
    }

    .modal-form-content {
        display: flex;
        flex-direction: column;
        gap: 1.3rem;
    }

    .modal-field {
        width: 100%;
        background: #101010;
        border: 1px solid #242424;
        color: #f0f0f0;
        padding: 14px;
        font-family: 'Inter', sans-serif;
        border-radius: 8px;
        transition: 0.3s ease;
        box-sizing: border-box;
    }

    .modal-field::placeholder {
        color: #626262;
    }

    .modal-field:focus {
        border-color: #555;
        outline: none;
        background: #151515;
    }

    .modal-save-btn {
        width: 100%;
        background: #ffffff;
        color: #000000;
        border: none;
        padding: 14px;
        font-weight: 700;
        font-family: 'Space Grotesk', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.24em;
        cursor: pointer;
        margin-top: 0.8rem;
        border-radius: 8px;
        transition: background 0.3s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }

    .modal-save-btn:hover {
        background: #dcdcdc;
        box-shadow: 0 16px 40px rgba(0,0,0,0.7);
        transform: translateY(-1px);
    }

    /* 年份电梯导航 */
    .year-nav {
        position: fixed;
        right: 3rem;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        z-index: 180;
        pointer-events: auto;
    }

    .year-pill {
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(5,5,5,0.7);
        color: #777;
        padding: 0.25rem 0.7rem;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.65rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
        transition: color 0.25s ease, border-color 0.25s ease, background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }

    .year-pill--active {
        color: #ffffff;
        border-color: rgba(255,255,255,0.4);
        background: #101010;
        transform: translateX(2px);
        box-shadow: 0 0 18px rgba(0,0,0,0.8);
    }

    #scroll-sentinel {
        height: 1px;
        margin-top: 60px;
    }

    @media (max-width: 1024px) {
        .year-nav {
            position: static;
            flex-direction: row;
            justify-content: flex-start;
            transform: none;
            margin: 0 0 1.2rem;
        }
    }

    @media (max-width: 768px) {
        main {
            padding: 140px 1.5rem 160px;
        }

        .timeline-grid {
            grid-template-columns: 26px minmax(0,1fr);
        }

        .timeline-axis {
            grid-column: 1;
        }

        .timeline-row {
            grid-template-columns: 26px minmax(0,1fr);
            padding: 2rem 0;
        }

        .axis-cell {
            grid-column: 1;
            justify-content: flex-start;
        }

        .axis-dot {
            margin-left: 8px;
        }

        .time-wrapper,
        .content-wrapper {
            grid-column: 2 !important;
            text-align: left !important;
            padding: 0 0 0 1.5rem !important;
        }

        .time-wrapper {
            margin-bottom: 0.4rem;
            opacity: 0.8;
        }

        .btn-delete,
        .btn-edit {
            left: auto !important;
            right: 0 !important;
            top: -25px;
            opacity: 1;
            font-size: 1rem;
        }

        .dock-inner {
            padding: 0.7rem 1.6rem;
            gap: 1.6rem;
        }

        dialog {
            padding: 2.2rem 1.8rem;
            max-height: calc(100vh - 2rem);
        }

        .timeline-controls {
            flex-direction: column;
            align-items: stretch;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        * {
            scroll-behavior: auto !important;
            animation-duration: 0.001ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.001ms !important;
        }
    }
</style>

<div class="cursor-glow" id="cursor-glow"></div>
<canvas id="hearts-canvas" style="position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:995;"></canvas>

<main aria-label="Shared timeline">
    <div class="timeline-controls">
        <form class="timeline-search" id="timeline-search-form" method="get" action="{{ url_for('index') }}">
            <input
                type="text"
                name="q"
                class="timeline-search-input"
                value="{{ search_query or '' }}"
                placeholder="Search memories..."
            >
            {% if filter_type %}
                <input type="hidden" name="type" value="{{ filter_type }}">
            {% endif %}
        </form>

        <div class="timeline-filters" role="tablist" aria-label="Filter by type">
            {% set ft = (filter_type or 'all') %}
            <button type="button" class="filter-pill {{ 'is-active' if ft == 'all' }}" data-filter="all">All</button>
            <button type="button" class="filter-pill {{ 'is-active' if ft == 'entry' }}" data-filter="entry">Text</button>
            <button type="button" class="filter-pill {{ 'is-active' if ft == 'photo' }}" data-filter="photo">Photo</button>
            <button type="button" class="filter-pill {{ 'is-active' if ft == 'keydate' }}" data-filter="keydate">Date</button>
        </div>
    </div>

    {% if years %}
    <nav class="year-nav" aria-label="Jump by year">
        {% for y in years %}
            <button type="button" class="year-pill" data-year="{{ y }}">{{ y }}</button>
        {% endfor %}
    </nav>
    {% endif %}

    <section class="timeline-grid" aria-live="polite">
        <div class="timeline-axis" aria-hidden="true"></div>

        {% include "_timeline_rows.html" %}
    </section>

    <div id="scroll-sentinel" aria-hidden="true"></div>
</main>

<div class="dock" aria-label="Memory controls">
    <div class="dock-inner">
        <button type="button" onclick="openModal('entry')" class="dock-btn" data-magnetic data-magnetic-strength="0.22">TEXT</button>
        <button type="button" onclick="triggerHearts()" class="dock-btn miss-you-btn" aria-label="Send hearts" data-magnetic data-magnetic-strength="0.3">❤</button>
        <button type="button" onclick="openModal('photo')" class="dock-btn" data-magnetic data-magnetic-strength="0.22">IMG</button>
        <button type="button" onclick="openModal('keydate')" class="dock-btn" data-magnetic data-magnetic-strength="0.22">DATE</button>
    </div>
</div>

<div id="modal-backdrop" class="modal-backdrop"></div>
<dialog id="input-modal" aria-modal="true" aria-labelledby="modal-title">
    <button class="modal-close" type="button" onclick="closeModal()" aria-label="Close">&times;</button>

    <h3 id="modal-title" class="modal-title">RECORD</h3>

    <form id="modal-form" method="post" enctype="multipart/form-data" class="modal-form-content">
        <label style="font-size:0.7rem; text-transform:uppercase; letter-spacing:0.18em; color:#6a6a6a;">
            When
            <input
                type="datetime-local"
                name="custom_date"
                id="date-input"
                class="modal-field"
                style="margin-top:0.4rem; font-size:0.8rem;"
            >
        </label>

        <div id="dynamic-fields"></div>

        <button type="submit" class="modal-save-btn">SAVE</button>
    </form>
</dialog>

<script src="https://unpkg.com/@studio-freight/lenis@1.1.18/bundled/lenis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script>
    const prefersReducedMotion =
        window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let lenisInstance = null;

    /* 1. Cursor glow */
    const cursorGlow = document.getElementById('cursor-glow');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let currentX = mouseX;
    let currentY = mouseY;

    if (cursorGlow) {
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        (function animateCursor() {
            currentX += (mouseX - currentX) * 0.12;
            currentY += (mouseY - currentY) * 0.12;
            cursorGlow.style.left = currentX + 'px';
            cursorGlow.style.top = currentY + 'px';
            if (!prefersReducedMotion) requestAnimationFrame(animateCursor);
        })();
    }

    /* 2. Hearts Canvas */
    const canvas = document.getElementById('hearts-canvas');
    const ctx = canvas.getContext('2d');
    let hearts = [];
    let isAnimatingHearts = false;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerHearts() {
        const originX = window.innerWidth / 2;
        const originY = window.innerHeight - 80;

        for (let i = 0; i < 26; i++) {
            hearts.push({
                x: originX,
                y: originY,
                size: Math.random() * 20 + 6,
                speedX: (Math.random() - 0.5) * 12,
                speedY: Math.random() * -15 - 6,
                opacity: 1,
                rotation: Math.random() * 360
            });
        }

        if (!isAnimatingHearts) {
            isAnimatingHearts = true;
            animateHearts();
        }
    }
    window.triggerHearts = triggerHearts;

    function animateHearts() {
        if (hearts.length === 0) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            isAnimatingHearts = false;
            return;
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        hearts.forEach((h, i) => {
            h.x += h.speedX;
            h.y += h.speedY;
            h.speedY += 0.35;
            h.opacity -= 0.012;

            ctx.save();
            ctx.translate(h.x, h.y);
            ctx.rotate(h.rotation);
            ctx.fillStyle = 'rgba(255,0,60,' + h.opacity + ')';
            ctx.font = h.size + 'px serif';
            ctx.fillText('❤', -h.size / 2, h.size / 2);
            ctx.restore();

            if (h.opacity <= 0) hearts.splice(i, 1);
        });
        requestAnimationFrame(animateHearts);
    }

    /* 3. Modal (create & edit) */
    const modal = document.getElementById('input-modal');
    const backdrop = document.getElementById('modal-backdrop');
    const dateInput = document.getElementById('date-input');
    const form = document.getElementById('modal-form');
    const fields = document.getElementById('dynamic-fields');
    const titleEl = document.getElementById('modal-title');

    function syncNowToDateInput() {
        if (!dateInput) return;
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        dateInput.value = now.toISOString().slice(0, 16);
    }

    function openModal(type) {
        if (!modal) return;

        syncNowToDateInput();
        fields.innerHTML = '';
        form.action = '';
        form.onsubmit = null;

        backdrop.classList.add('active');
        modal.showModal();
        document.documentElement.classList.add('modal-open');
        if (lenisInstance) lenisInstance.stop();

        if (type === 'entry') {
            form.action = "{{ url_for('add_entry') }}";
            titleEl.innerText = 'THOUGHT';
            fields.innerHTML = `
                <textarea
                    name="content"
                    rows="5"
                    class="modal-field"
                    placeholder="."
                    style="resize:vertical;"
                    required
                ></textarea>
                <input
                    name="location"
                    placeholder="Where (optional)"
                    class="modal-field"
                    style="margin-top:0.4rem;"
                >
            `;
        } else if (type === 'keydate') {
            form.action = "{{ url_for('add_keydate') }}";
            titleEl.innerText = 'MEMORY';
            fields.innerHTML = `
                <input
                    name="title"
                    placeholder="Title"
                    class="modal-field"
                    required
                >
                <input type="hidden" name="date" id="kd-hidden">
                <input
                    name="location"
                    placeholder="Where (optional)"
                    class="modal-field"
                    style="margin-top:0.4rem;"
                >
            `;
            form.onsubmit = function () {
                const hidden = document.getElementById('kd-hidden');
                if (hidden && dateInput) hidden.value = dateInput.value;
            };
        } else if (type === 'photo') {
            form.action = "{{ url_for('add_photo') }}";
            titleEl.innerText = 'VISUAL';
            fields.innerHTML = `
                <input
                    type="file"
                    name="photo"
                    class="modal-field"
                    accept="image/*"
                    required
                >
                <input
                    name="caption"
                    placeholder="Caption"
                    class="modal-field"
                    style="margin-top:6px"
                >
                <input
                    name="location"
                    placeholder="Where (optional)"
                    class="modal-field"
                    style="margin-top:0.4rem;"
                >
            `;
        }
    }
    window.openModal = openModal;

    function openEditModal(button) {
        if (!modal) return;
        const type = button.dataset.editType;
        const id = button.dataset.editId;
        const timestamp = button.dataset.editTimestamp || '';
        const location = button.dataset.editLocation || '';

        fields.innerHTML = '';
        form.action = '';
        form.onsubmit = null;

        if (timestamp && dateInput) {
            dateInput.value = timestamp;
        } else {
            syncNowToDateInput();
        }

        backdrop.classList.add('active');
        modal.showModal();
        document.documentElement.classList.add('modal-open');
        if (lenisInstance) lenisInstance.stop();

        titleEl.innerText = 'EDIT';
        form.action = `/edit/${type}/${id}`;

        if (type === 'entry') {
            fields.innerHTML = `
                <textarea
                    name="content"
                    rows="5"
                    class="modal-field"
                    style="resize:vertical;"
                    required
                ></textarea>
                <input
                    name="location"
                    placeholder="Where (optional)"
                    class="modal-field"
                    style="margin-top:0.4rem;"
                >
            `;
            const textarea = fields.querySelector('textarea[name="content"]');
            const locInput = fields.querySelector('input[name="location"]');
            textarea.value = button.dataset.editContent || '';
            locInput.value = location || '';
        } else if (type === 'keydate') {
            fields.innerHTML = `
                <input
                    name="title"
                    class="modal-field"
                    required
                >
                <input type="hidden" name="date" id="kd-hidden">
                <input
                    name="location"
                    placeholder="Where (optional)"
                    class="modal-field"
                    style="margin-top:0.4rem;"
                >
            `;
            const titleInput = fields.querySelector('input[name="title"]');
            const locInput = fields.querySelector('input[name="location"]');
            const hidden = fields.querySelector('#kd-hidden');
            titleInput.value = button.dataset.editTitle || '';
            locInput.value = location || '';
            if (hidden && dateInput) hidden.value = dateInput.value;

            form.onsubmit = function () {
                const hidden = document.getElementById('kd-hidden');
                if (hidden && dateInput) hidden.value = dateInput.value;
            };
        } else if (type === 'photo') {
            fields.innerHTML = `
                <input
                    type="file"
                    name="photo"
                    class="modal-field"
                    accept="image/*"
                >
                <input
                    name="caption"
                    placeholder="Caption"
                    class="modal-field"
                    style="margin-top:6px"
                >
                <input
                    name="location"
                    placeholder="Where (optional)"
                    class="modal-field"
                    style="margin-top:0.4rem;"
                >
            `;
            const captionInput = fields.querySelector('input[name="caption"]');
            const locInput = fields.querySelector('input[name="location"]');
            captionInput.value = button.dataset.editCaption || '';
            locInput.value = location || '';
        }
    }

    function closeModal() {
        if (!modal) return;
        backdrop.classList.remove('active');
        modal.close();
        document.documentElement.classList.remove('modal-open');
        if (lenisInstance) lenisInstance.start();
    }
    window.closeModal = closeModal;

    if (backdrop) backdrop.addEventListener('click', closeModal);

    /* 4. Lenis 平滑滚动 */
    if (!prefersReducedMotion && typeof Lenis !== 'undefined') {
        const lenis = new Lenis({
            lerp: 0.12,
            smoothWheel: true,
            smoothTouch: false,
            wheelMultiplier: 1.1
        });
        lenisInstance = lenis;

        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);
    }

    /* 5. GSAP Reveal & 视差 */
    function enhanceTimelineRows(root) {
        const scope = root || document;

        if (prefersReducedMotion || typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') {
            scope.querySelectorAll('.time-wrapper, .content-wrapper').forEach(el => {
                el.style.opacity = 1;
                el.style.transform = 'none';
            });
            return;
        }

        const rows = scope.querySelectorAll('.timeline-row:not([data-animated])');
        rows.forEach((row) => {
            row.dataset.animated = '1';
            const timeCol = row.querySelector('.time-wrapper');
            const contentCol = row.querySelector('.content-wrapper');
            const dot = row.querySelector('.axis-dot');
            const photo = row.querySelector('.photo-frame');
            const isEven = row.classList.contains('even');

            const tl = gsap.timeline({
                scrollTrigger: {
                    trigger: row,
                    start: 'top 80%',
                    end: 'bottom 40%',
                    toggleActions: 'play none none reverse'
                }
            });

            tl.fromTo(
                timeCol,
                { opacity: 0, y: 26 },
                { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' },
                0
            ).fromTo(
                contentCol,
                { opacity: 0, y: 32 },
                { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out' },
                0.05
            ).fromTo(
                dot,
                { scale: 0.7, opacity: 0.5 },
                { scale: 1, opacity: 1, duration: 0.6, ease: 'back.out(1.7)' },
                0.1
            );

            if (photo) {
                gsap.to(photo, {
                    y: isEven ? -14 : 14,
                    ease: 'none',
                    scrollTrigger: {
                        trigger: row,
                        start: 'top bottom',
                        end: 'bottom top',
                        scrub: true
                    }
                });
            }
        });
    }

    if (!prefersReducedMotion && typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
        gsap.registerPlugin(ScrollTrigger);

        if (lenisInstance) {
            lenisInstance.on('scroll', ScrollTrigger.update);
            ScrollTrigger.scrollerProxy(document.body, {
                scrollTop(value) {
                    return arguments.length ? lenisInstance.scrollTo(value) : window.scrollY || window.pageYOffset;
                },
                getBoundingClientRect() {
                    return { top: 0, left: 0, width: window.innerWidth, height: window.innerHeight };
                }
            });
        }

        enhanceTimelineRows(document);

        ScrollTrigger.addEventListener('refresh', () => {
            if (lenisInstance && typeof lenisInstance.update === 'function') {
                lenisInstance.update();
            }
        });
        ScrollTrigger.refresh();
    } else {
        document.querySelectorAll('.time-wrapper, .content-wrapper').forEach(el => {
            el.style.opacity = 1;
            el.style.transform = 'none';
        });
    }

    /* 6. 高亮逻辑：用事件委托 + 单行激活，避免「时间重叠」 */
    const timelineGrid = document.querySelector('.timeline-grid');

    function setActiveRow(row) {
        document.querySelectorAll('.timeline-row.timeline-row--active').forEach(r => {
            if (r !== row) r.classList.remove('timeline-row--active');
        });
        if (row) row.classList.add('timeline-row--active');
    }

    if (timelineGrid) {
        timelineGrid.addEventListener('mouseover', (e) => {
            const row = e.target.closest('.timeline-row');
            if (!row || !timelineGrid.contains(row)) return;
            setActiveRow(row);
            if (cursorGlow) cursorGlow.classList.add('cursor-glow--active');
        });

        timelineGrid.addEventListener('mouseout', (e) => {
            const related = e.relatedTarget && e.relatedTarget.closest
                ? e.relatedTarget.closest('.timeline-row')
                : null;
            if (!related) {
                setActiveRow(null);
                if (cursorGlow) cursorGlow.classList.remove('cursor-glow--active');
            }
        });
    }

    /* 7. 磁性效果（支持动态追加元素） */
    function initMagneticElements(root) {
        if (typeof gsap === 'undefined') return;
        const scope = root || document;
        const magneticItems = scope.querySelectorAll('[data-magnetic]:not([data-magnetic-initialized])');
        magneticItems.forEach((item) => {
            item.dataset.magneticInitialized = '1';
            const strength = parseFloat(item.dataset.magneticStrength || '0.25');
            let bounds;

            function onMouseMove(e) {
                if (!bounds) bounds = item.getBoundingClientRect();
                const relX = e.clientX - (bounds.left + bounds.width / 2);
                const relY = e.clientY - (bounds.top + bounds.height / 2);

                gsap.to(item, {
                    x: relX * strength,
                    y: relY * strength,
                    duration: 0.5,
                    ease: 'power3.out'
                });
            }

            function reset() {
                bounds = null;
                gsap.to(item, {
                    x: 0,
                    y: 0,
                    duration: 0.8,
                    ease: 'elastic.out(1.1, 0.4)'
                });
            }

            item.addEventListener('mouseenter', () => {
                bounds = item.getBoundingClientRect();
                window.addEventListener('mousemove', onMouseMove);
            });

            item.addEventListener('mouseleave', () => {
                window.removeEventListener('mousemove', onMouseMove);
                reset();
            });
        });
    }
    initMagneticElements(document);

    /* 8. 搜索 & 类型过滤交互（通过 URL 参数刷新） */
    const searchForm = document.getElementById('timeline-search-form');
    if (searchForm) {
        searchForm.addEventListener('submit', (e) => {
            // 默认表单提交即可，这里只清理 page 参数
            e.preventDefault();
            const formData = new FormData(searchForm);
            const params = new URLSearchParams(window.location.search);
            params.delete('page');
            const q = (formData.get('q') || '').trim();
            if (q) {
                params.set('q', q);
            } else {
                params.delete('q');
            }
            const type = formData.get('type');
            if (type && type !== 'all') {
                params.set('type', type);
            }
            const qs = params.toString();
            window.location.search = qs;
        });
    }

    document.querySelectorAll('.filter-pill').forEach((pill) => {
        pill.addEventListener('click', () => {
            const type = pill.dataset.filter;
            const params = new URLSearchParams(window.location.search);
            params.delete('page');
            if (type === 'all') {
                params.delete('type');
            } else {
                params.set('type', type);
            }
            const qInput = searchForm && searchForm.querySelector('input[name="q"]');
            if (qInput && qInput.value.trim()) {
                params.set('q', qInput.value.trim());
            }
            const qs = params.toString();
            window.location.search = qs;
        });
    });

    /* 9. 年份电梯导航：点击跳转 & 自动高亮当前年份 */
    const yearButtons = document.querySelectorAll('.year-pill');

    function scrollToRow(row) {
        if (!row) return;
        if (lenisInstance && typeof lenisInstance.scrollTo === 'function') {
            lenisInstance.scrollTo(row, { offset: -160 });
        } else {
            const top = row.getBoundingClientRect().top + window.scrollY - 160;
            window.scrollTo({ top, behavior: 'smooth' });
        }
    }

    yearButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
            const targetYear = btn.dataset.year;
            const targetRow = document.querySelector(`.timeline-row[data-year="${targetYear}"]`);
            if (targetRow) scrollToRow(targetRow);
        });
    });

    function setActiveYear(year) {
        yearButtons.forEach((btn) => {
            btn.classList.toggle('year-pill--active', btn.dataset.year === String(year));
        });
    }

    if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver((entries) => {
            let candidate = null;
            entries.forEach((entry) => {
                if (!entry.isIntersecting) return;
                const year = entry.target.dataset.year;
                if (!candidate || entry.boundingClientRect.top < candidate.top) {
                    candidate = { year, top: entry.boundingClientRect.top };
                }
            });
            if (candidate && candidate.year) {
                setActiveYear(candidate.year);
            }
        }, { threshold: 0.35 });

        document.querySelectorAll('.timeline-row').forEach((row) => io.observe(row));
    }

    /* 10. 编辑按钮绑定 */
    function bindEditButtons(root) {
        const scope = root || document;
        const editButtons = scope.querySelectorAll('.btn-edit:not([data-edit-bound])');
        editButtons.forEach((btn) => {
            btn.dataset.editBound = '1';
            btn.addEventListener('click', () => openEditModal(btn));
        });
    }
    bindEditButtons(document);

    /* 11. 无限加载：滚动到底部自动请求 /api/timeline */
    let currentPage = Number('{{ page|default(1)|int }}');
    let loadingMore = false;
    let hasMore = '{{ "true" if has_more else "false" }}' === 'true';

    const sentinel = document.getElementById('scroll-sentinel');

    async function loadNextPage() {
        if (!hasMore || loadingMore) return;
        loadingMore = true;

        try {
            const params = new URLSearchParams(window.location.search);
            const nextPage = currentPage + 1;
            params.set('page', nextPage);
            const res = await fetch(`/api/timeline?${params.toString()}`, {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });
            if (!res.ok) return;
            const data = await res.json();
            if (data.html) {
                const temp = document.createElement('div');
                temp.innerHTML = data.html;
                const newRows = temp.querySelectorAll('.timeline-row');
                const grid = document.querySelector('.timeline-grid');
                newRows.forEach((row) => grid.appendChild(row));

                bindEditButtons(temp);
                initMagneticElements(temp);
                enhanceTimelineRows(temp);

                if (typeof ScrollTrigger !== 'undefined') {
                    ScrollTrigger.refresh();
                }
            }
            currentPage = nextPage;
            hasMore = !!data.has_more;
            if (!hasMore && sentinel) {
                sentinel.remove();
            }
        } catch (err) {
            console.error(err);
        } finally {
            loadingMore = false;
        }
    }

    if (sentinel && hasMore && 'IntersectionObserver' in window) {
        const ioMore = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    loadNextPage();
                }
            });
        }, { rootMargin: '0px 0px 300px 0px' });
        ioMore.observe(sentinel);
    }
</script>
