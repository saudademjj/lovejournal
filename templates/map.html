{% extends "base.html" %}
{% block content %}
<style>
    main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 120px 2rem 80px;
        position: relative;
        z-index: 2;
    }

    #map {
        width: 100%;
        height: calc(100vh - 180px);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0,0,0,0.9);
        border: 1px solid rgba(255,255,255,0.06);
    }

    .map-legend {
        position: absolute;
        top: 140px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        padding: 0.65rem 1.2rem;
        border-radius: 999px;
        background: rgba(5,5,5,0.82);
        border: 1px solid rgba(255,255,255,0.08);
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 1rem;
        box-shadow: 0 18px 40px rgba(0,0,0,0.7);
    }

    .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.05);
    }

    .map-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
    }
    .map-dot.entry { background: #ffffff; box-shadow: 0 0 0 2px rgba(255,255,255,0.1); }
    .map-dot.photo { background: var(--neon-blue); box-shadow: 0 0 0 2px rgba(43,0,255,0.16); }
    .map-dot.keydate { background: var(--neon-pink); box-shadow: 0 0 0 2px rgba(255,0,60,0.18); }

    @media (max-width: 768px) {
        main { padding: 120px 1.2rem 60px; }
        #map { height: calc(100vh - 160px); }
        .map-legend {
            left: 1.4rem;
            right: 1.4rem;
            justify-content: center;
        }
    }
</style>

<div class="map-legend" aria-label="Legend for map markers">
    <span class="legend-item"><span class="map-dot entry"></span>TEXT</span>
    <span class="legend-item"><span class="map-dot photo"></span>PHOTO</span>
    <span class="legend-item"><span class="map-dot keydate"></span>DATE</span>
</div>

<main aria-label="Map of memories">
    <div id="map"></div>
</main>

<script>
    // 高德 JSAPI 2.0 安全配置
    window._AMapSecurityConfig = {
        securityJsCode: '9a6053273e69e199acb91aae8add03c9'
    };
</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=7432049c00644e7496cd0151d59380c9&plugin=AMap.HeatMap"></script>

<script>
    const markersData = {{ markers|tojson|safe }} || [];

    const map = new AMap.Map('map', {
        viewMode: '2D',
        zoom: 4,
        center: [104.06, 30.67], // 大致中国中部
        mapStyle: 'amap://styles/dark',
        pitch: 0
    });

    const markerLayer = new AMap.OverlayGroup();
    map.add(markerLayer);
    let markerCount = 0;

    function colorForKind(kind) {
        if (kind === 'photo') return '#2b00ff';
        if (kind === 'keydate') return '#ff003c';
        return '#ffffff';
    }

    const heatData = [];
    let heatmap = null;

    map.plugin(['AMap.HeatMap'], function () {
        heatmap = new AMap.HeatMap(map, {
            radius: 25,
            opacity: [0, 0.8],
        });
        if (heatData.length) {
            heatmap.setDataSet({ data: heatData, max: 6 });
        }
    });

    function buildMarker(m) {
        const color = colorForKind(m.kind);
        const pos = new AMap.LngLat(m.lng, m.lat);

        const marker = new AMap.CircleMarker({
            center: pos,
            radius: 6,
            strokeColor: color,
            strokeWeight: 1,
            fillColor: color,
            fillOpacity: 0.85,
            zIndex: 10
        });
        let html = `
            <div style="min-width:200px;color:#fff;">
                <div style="font-family:'JetBrains Mono',monospace;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:#aaa;margin-bottom:4px;">
                    ${m.timestamp || ''}
                </div>
                <div style="font-family:'Inter',sans-serif;font-size:0.9rem;color:#fff;margin-bottom:4px;">
                    ${m.snippet || ''}
                </div>
                <div style="font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:#888;">
                    ${m.label || ''}
                </div>
            </div>
        `;
        if (m.image) {
            html = `
                <div style="min-width:220px;color:#fff;">
                    <img src="${m.image}" style="width:100%;border-radius:8px;margin-bottom:6px;" />
                    ${html}
                </div>
            `;
        }
        marker.setTitle(m.label || '');
        marker.on('click', () => {
            const info = new AMap.InfoWindow({
                content: html,
                offset: new AMap.Pixel(0, -16)
            });
            info.open(map, marker.getCenter());
        });
        markerLayer.addOverlay(marker);
        markerCount += 1;

        heatData.push({ lng: m.lng, lat: m.lat, count: 1 });
        if (heatmap) {
            heatmap.setDataSet({ data: heatData, max: 6 });
        }
    }

    const withCoords = markersData.filter(m => m.lat !== null && m.lng !== null);
    const withoutCoords = markersData.filter(m => (m.lat === null || m.lng === null) && m.label);

    withCoords.forEach(m => buildMarker(m));

    if (withoutCoords.length) {
        map.plugin(['AMap.Geocoder'], function () {
            const geocoder = new AMap.Geocoder({ city: '全国' });

            withoutCoords.forEach(m => {
                geocoder.getLocation(m.label, function (status, result) {
                    if (status === 'complete' && result.geocodes && result.geocodes.length) {
                        const loc = result.geocodes[0].location;
                        m.lng = loc.lng;
                        m.lat = loc.lat;
                        buildMarker(m);
                        map.setFitView(markerLayer, false, [40, 40, 40, 40]);
                    }
                });
            });
        });
    }

    if (markerCount) {
        map.setFitView(markerLayer, false, [40, 40, 40, 40]);
    }
</script>
{% endblock %}
