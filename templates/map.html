{% extends "base.html" %}
{% block content %}
<style>
    main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 120px 2rem 80px;
        position: relative;
        z-index: 2;
    }

    #map {
        width: 100%;
        height: calc(100vh - 180px);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0,0,0,0.9);
        border: 1px solid rgba(255,255,255,0.06);
        background: #0f0f0f;
        position: relative; /* For custom controls */
    }

    /* Legend / Filter Bar */
    .map-legend {
        position: absolute;
        top: 140px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        padding: 0.65rem 1.2rem;
        border-radius: 999px;
        background: rgba(5,5,5,0.82);
        border: 1px solid rgba(255,255,255,0.08);
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 1rem;
        box-shadow: 0 18px 40px rgba(0,0,0,0.7);
        backdrop-filter: blur(12px);
    }

    .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.05);
        cursor: pointer;
        transition: all 0.3s ease;
        user-select: none;
    }
    .legend-item:hover {
        background: rgba(255,255,255,0.1);
        border-color: rgba(255,255,255,0.15);
    }
    .legend-item.is-off {
        opacity: 0.4;
        background: transparent;
        border-color: transparent;
    }

    .map-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        transition: background 0.3s ease;
    }
    .map-dot.entry { background: #ffffff; box-shadow: 0 0 0 2px rgba(255,255,255,0.1); }
    .map-dot.photo { background: var(--neon-blue); box-shadow: 0 0 0 2px rgba(43,0,255,0.16); }
    .map-dot.keydate { background: var(--neon-pink); box-shadow: 0 0 0 2px rgba(255,0,60,0.18); }

    /* Zoom Controls (Minimal & Beautiful) */
    .map-zoom-controls {
        position: absolute;
        bottom: 3rem;
        right: 3rem;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        z-index: 120;
    }
    .zoom-btn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(5,5,5,0.8);
        border: 1px solid rgba(255,255,255,0.1);
        color: #f0f0f0;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 1.4rem;
        font-weight: 300;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(12px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
        padding: 0;
        line-height: 1;
    }
    .zoom-btn:hover {
        background: rgba(255,255,255,0.1);
        color: #fff;
        transform: translateY(-2px);
    }
    .zoom-btn:active {
        transform: translateY(0);
    }

    /* Custom Info Window Styling */
    .amap-info-window-custom {
        background: #050505;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        padding: 1rem;
        box-shadow: 0 20px 50px rgba(0,0,0,0.95);
        color: #fff;
        min-width: 220px;
        max-width: 280px;
        position: relative;
    }

    /* Little triangle arrow at bottom */
    .amap-info-window-custom::after {
        content: '';
        position: absolute;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%) rotate(45deg);
        width: 10px;
        height: 10px;
        background: #050505;
        border-right: 1px solid rgba(255,255,255,0.12);
        border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .info-close {
        position: absolute;
        top: 6px;
        right: 8px;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 1.2rem;
        color: #666;
        cursor: pointer;
        line-height: 1;
        transition: color 0.2s;
    }
    .info-close:hover { color: var(--neon-pink); }

    .info-time {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.65rem;
        letter-spacing: 0.12em;
        color: #888;
        margin-bottom: 0.5rem;
        text-transform: uppercase;
    }

    .info-content {
        font-family: 'Inter', sans-serif;
        font-size: 0.85rem;
        line-height: 1.6;
        color: #e0e0e0;
        margin-bottom: 0.6rem;
        word-wrap: break-word;
    }

    .info-geo {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.6rem;
        letter-spacing: 0.08em;
        /* 【修复】调亮颜色，确保可见 */
        color: #999;
        border-top: 1px solid rgba(255,255,255,0.08);
        padding-top: 0.4rem;
    }

    .info-img {
        width: 100%;
        border-radius: 6px;
        margin-bottom: 0.6rem;
        display: block;
        border: 1px solid rgba(255,255,255,0.08);
    }

    @media (max-width: 768px) {
        main { padding: 120px 1.2rem 60px; }
        #map { height: calc(100vh - 160px); }
        .map-legend {
            left: 1.4rem;
            right: 1.4rem;
            justify-content: center;
        }
        .map-zoom-controls {
            bottom: 2rem;
            right: 1.5rem;
        }
        .zoom-btn {
            width: 38px;
            height: 38px;
            font-size: 1.2rem;
        }
    }
</style>

<div class="map-legend" aria-label="Legend for map markers">
    <div class="legend-item" id="filter-entry" onclick="toggleFilter('entry')">
        <span class="map-dot entry"></span>TEXT
    </div>
    <div class="legend-item" id="filter-photo" onclick="toggleFilter('photo')">
        <span class="map-dot photo"></span>PHOTO
    </div>
    <div class="legend-item" id="filter-keydate" onclick="toggleFilter('keydate')">
        <span class="map-dot keydate"></span>DATE
    </div>
</div>

<div class="map-zoom-controls">
    <button type="button" class="zoom-btn" onclick="zoomIn()" aria-label="Zoom In">+</button>
    <button type="button" class="zoom-btn" onclick="zoomOut()" aria-label="Zoom Out">−</button>
</div>

<main aria-label="Map of memories">
    <div id="map"></div>
</main>

<script>
    window._AMapSecurityConfig = {
        securityJsCode: '9a6053273e69e199acb91aae8add03c9'
    };
</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=7432049c00644e7496cd0151d59380c9&plugin=AMap.HeatMap"></script>

<script>
    const markersData = JSON.parse('{{ markers|tojson|safe }}' || '[]');

    const map = new AMap.Map('map', {
        viewMode: '2D',
        zoom: 4,
        center: [104.06, 30.67],
        mapStyle: 'amap://styles/dark',
        pitch: 0
    });

    const validMarkers = markersData.filter(m => m.lat !== null && m.lng !== null);
    let markerInstances = []; // Store references for filtering
    let currentInfoWindow = null;

    // Filter State
    const filterState = {
        entry: true,
        photo: true,
        keydate: true
    };

    function colorForKind(kind) {
        if (kind === 'photo') return '#2b00ff';
        if (kind === 'keydate') return '#ff003c';
        return '#ffffff';
    }

    const heatData = [];
    let heatmap = null;

    map.plugin(['AMap.HeatMap'], function () {
        heatmap = new AMap.HeatMap(map, {
            radius: 35,
            opacity: [0, 0.7],
        });
        if(heatData.length > 0) {
            heatmap.setDataSet({ data: heatData, max: 8 });
        }
    });

    const positionCounts = {};

    function getJitteredPos(lat, lng) {
        const key = Math.round(lat * 10) + ',' + Math.round(lng * 10);
        if (!positionCounts[key]) positionCounts[key] = 0;
        const count = positionCounts[key];
        positionCounts[key]++;

        if (count > 0) {
            const angle = count * 137.5 * (Math.PI / 180);
            const radius = 0.02 * Math.sqrt(count);
            const newLat = lat + radius * Math.cos(angle);
            const newLng = lng + radius * Math.sin(angle) * 1.3;
            return new AMap.LngLat(newLng, newLat);
        }
        return new AMap.LngLat(lng, lat);
    }

    // 【修复重点】强制显示经纬度
    // 即使 originalLabel 里没有数字，也会根据 lat/lng 补上 "36 101"
    function formatGeoLabel(originalLabel, lat, lng) {
        // 先尝试清理原始 label 中的旧坐标（如果有的话）
        let text = originalLabel || '';
        text = text.replace(/^[\d\.\-,]+\s*/, ''); // 去除开头的坐标

        // 确保是数字类型
        const latNum = parseFloat(lat);
        const lngNum = parseFloat(lng);

        if (isNaN(latNum) || isNaN(lngNum)) return text;

        const latInt = Math.floor(latNum);
        const lngInt = Math.floor(lngNum);

        // 极简风格 "36 101"
        const coordsStr = `${latInt} ${lngInt}`;

        // 只有地名就补坐标，有地名就拼接
        if (text) {
            return `${coordsStr} ${text}`;
        }
        return coordsStr;
    }

    function buildMarker(m) {
        const color = colorForKind(m.kind);
        const pos = getJitteredPos(m.lat, m.lng);

        const marker = new AMap.CircleMarker({
            center: pos,
            radius: 6,
            strokeColor: color,
            strokeWeight: 1,
            fillColor: color,
            fillOpacity: 0.9,
            zIndex: 100,
            cursor: 'pointer',
            bubble: true,
            extData: { kind: m.kind }
        });

        const displayGeo = formatGeoLabel(m.label, m.lat, m.lng);

        let contentHtml = '';
        if (m.image) {
            contentHtml += `<img src="${m.image}" class="info-img" loading="lazy">`;
        }
        let snippet = m.snippet || '';
        if (snippet.length > 60) snippet = snippet.substring(0, 60) + '...';

        contentHtml += `<div class="info-content">${snippet}</div>`;

        const html = `
            <div class="amap-info-window-custom">
                <span class="info-close" onclick="closeInfoWindow()">×</span>
                <div class="info-time">${m.timestamp}</div>
                ${contentHtml}
                <div class="info-geo">${displayGeo}</div>
            </div>
        `;

        marker.on('click', () => {
            if (currentInfoWindow) currentInfoWindow.close();
            const info = new AMap.InfoWindow({
                isCustom: true,
                content: html,
                offset: new AMap.Pixel(0, -12),
                autoMove: true
            });
            info.open(map, pos);
            currentInfoWindow = info;
        });

        marker.setMap(map);
        markerInstances.push(marker);

        heatData.push({ lng: m.lng, lat: m.lat, count: 1 });
    }

    window.closeInfoWindow = function() {
        if (currentInfoWindow) {
            currentInfoWindow.close();
            currentInfoWindow = null;
        }
    };

    window.toggleFilter = function(type) {
        filterState[type] = !filterState[type];

        const el = document.getElementById('filter-' + type);
        if (filterState[type]) {
            el.classList.remove('is-off');
        } else {
            el.classList.add('is-off');
        }

        markerInstances.forEach(marker => {
            const k = marker.getExtData().kind;
            if (filterState[k]) {
                marker.show();
            } else {
                marker.hide();
            }
        });
    };

    // 【修复重点】平滑缩放
    // 使用高德原生的 zoomIn / zoomOut 实现动画
    window.zoomIn = function() {
        map.zoomIn();
    };

    window.zoomOut = function() {
        map.zoomOut();
    };

    // Init
    validMarkers.forEach(m => buildMarker(m));

    if (heatmap && heatData.length) {
        heatmap.setDataSet({ data: heatData, max: 8 });
    }

    if (markerInstances.length > 0) {
        map.setFitView(null, false, [100, 60, 100, 60]);
    }
</script>
{% endblock %}
