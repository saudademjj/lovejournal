{% extends "base.html" %}
{% block content %}
<style>
    main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 120px 2rem 80px;
        position: relative;
        z-index: 2;
    }

    #map {
        width: 100%;
        height: calc(100vh - 180px);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0,0,0,0.9);
        border: 1px solid rgba(255,255,255,0.08);
        background: #050505;
        position: relative;
    }
    #map canvas {
        filter: grayscale(0.82) saturate(0.6) contrast(1.08) brightness(0.94);
    }
    #map::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
            linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
        background-size: 120px 120px, 120px 120px;
        mix-blend-mode: soft-light;
        pointer-events: none;
    }

    /* Legend / Filter Bar */
    .map-legend {
        position: absolute;
        top: 140px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        padding: 0.65rem 1.2rem;
        border-radius: 999px;
        background: rgba(5,5,5,0.82);
        border: 1px solid rgba(255,255,255,0.08);
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 1rem;
        box-shadow: 0 18px 40px rgba(0,0,0,0.7);
        backdrop-filter: blur(12px);
    }

    .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.05);
        cursor: pointer;
        transition: all 0.3s ease;
        user-select: none;
    }
    .legend-item:hover {
        background: rgba(255,255,255,0.1);
        border-color: rgba(255,255,255,0.15);
    }
    .legend-item.is-off {
        opacity: 0.4;
        background: transparent;
        border-color: transparent;
    }

    .map-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        transition: background 0.3s ease, box-shadow 0.3s ease;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16);
    }
    .map-dot.entry { background: rgba(255,255,255,0.78); }
    .map-dot.photo { background: rgba(140,170,255,0.82); }
    .map-dot.keydate { background: var(--neon-pink); box-shadow: 0 0 0 1px rgba(255,0,60,0.35); }

    /* Zoom Controls */
    .map-zoom-controls {
        position: absolute;
        bottom: 3rem;
        right: 3rem;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        z-index: 120;
    }
    .zoom-btn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(5,5,5,0.8);
        border: 1px solid rgba(255,255,255,0.1);
        color: #f0f0f0;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 1.4rem;
        font-weight: 300;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(12px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
        padding: 0;
        line-height: 1;
    }
    .zoom-btn:hover {
        background: rgba(255,255,255,0.1);
        color: #fff;
        transform: translateY(-2px);
    }
    .zoom-btn:active {
        transform: translateY(0);
    }

    /* Custom Info Window Styling */
    .amap-info-window-custom {
        background: #050505;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        padding: 1rem;
        box-shadow: 0 20px 50px rgba(0,0,0,0.95);
        color: #fff;
        min-width: 220px;
        max-width: 280px;
        position: relative;
    }

    /* Keydate marker */
    .keydate-pin {
        width: 12px;
        height: 12px;
        transform: translate(-50%, -50%);
        display: grid;
        place-items: center;
        animation: kd-breathe 2.8s ease-in-out infinite;
        filter: drop-shadow(0 0 10px rgba(255,0,60,0.45));
    }
    .keydate-pin svg {
        width: 12px;
        height: 12px;
        fill: var(--neon-pink);
    }
    @keyframes kd-breathe {
        0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.95; }
        50%      { transform: translate(-50%, -50%) scale(1.12); opacity: 1; }
    }

    .amap-info-window-custom::after {
        content: '';
        position: absolute;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%) rotate(45deg);
        width: 10px;
        height: 10px;
        background: #050505;
        border-right: 1px solid rgba(255,255,255,0.12);
        border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .info-close {
        position: absolute;
        top: 6px;
        right: 8px;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 1.2rem;
        color: #666;
        cursor: pointer;
        line-height: 1;
        transition: color 0.2s;
    }
    .info-close:hover { color: var(--neon-pink); }

    .info-time {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.65rem;
        letter-spacing: 0.12em;
        color: #888;
        margin-bottom: 0.5rem;
        text-transform: uppercase;
    }

    .info-content {
        font-family: 'Inter', sans-serif;
        font-size: 0.85rem;
        line-height: 1.6;
        color: #e0e0e0;
        margin-bottom: 0.6rem;
        word-wrap: break-word;
    }

    .info-geo {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.6rem;
        letter-spacing: 0.08em;
        color: #999;
        border-top: 1px solid rgba(255,255,255,0.08);
        padding-top: 0.4rem;
    }

    .info-img {
        width: 100%;
        border-radius: 6px;
        margin-bottom: 0.6rem;
        display: block;
        border: 1px solid rgba(255,255,255,0.08);
    }

    @media (max-width: 768px) {
        main { padding: 120px 1.2rem 60px; }
        #map { height: calc(100vh - 160px); }
        .map-legend {
            left: 1.4rem;
            right: 1.4rem;
            justify-content: center;
        }
        .map-zoom-controls {
            bottom: 2rem;
            right: 1.5rem;
        }
        .zoom-btn {
            width: 38px;
            height: 38px;
            font-size: 1.2rem;
        }
    }

    .map-badge {
        position: absolute;
        top: 90px;
        left: 50%;
        transform: translateX(-50%);
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.5rem 0.9rem;
        border-radius: 999px;
        background: rgba(0,0,0,0.7);
        border: 1px solid rgba(255,255,255,0.08);
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #e0e0e0;
        box-shadow: 0 16px 40px rgba(0,0,0,0.7);
    }
    .map-badge::before,
    .map-badge::after {
        content: '';
        display: block;
        width: 14px;
        height: 1px;
        background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.5), rgba(255,255,255,0));
    }
</style>

<div class="map-legend" aria-label="Legend for map markers">
    <div class="legend-item" id="filter-entry" onclick="toggleFilter('entry')">
        <span class="map-dot entry"></span>TEXT
    </div>
    <div class="legend-item" id="filter-photo" onclick="toggleFilter('photo')">
        <span class="map-dot photo"></span>PHOTO
    </div>
    <div class="legend-item" id="filter-keydate" onclick="toggleFilter('keydate')">
        <span class="map-dot keydate"></span>DATE
    </div>
</div>

<div class="map-zoom-controls">
    <button type="button" class="zoom-btn" onclick="zoomIn()" aria-label="Zoom In">+</button>
    <button type="button" class="zoom-btn" onclick="zoomOut()" aria-label="Zoom Out">−</button>
</div>

<main aria-label="Map of memories">
    <div class="map-badge">ATLAS / TRACE</div>
    <div id="map"></div>
</main>

<script>
    window._AMapSecurityConfig = {
        securityJsCode: '9a6053273e69e199acb91aae8add03c9'
    };
</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=7432049c00644e7496cd0151d59380c9&plugin=AMap.Geocoder"></script>

<script>
    const markersData = JSON.parse('{{ markers|tojson|safe }}' || '[]');

    const map = new AMap.Map('map', {
        viewMode: '2D',
        zoom: 4,
        center: [104.06, 30.67],
        mapStyle: 'amap://styles/dark',
        pitch: 0,
        dragEnable: true,
        zoomEnable: true,
    });

    const validMarkers = markersData.filter(m => m.lat !== null && m.lng !== null);
    let markerInstances = [];
    let currentInfoWindow = null;
    let geocoder = null;
    let districtLayer = null;
    const visitedAdcodes = new Set();
    const normalizeAdcode = (code) => {
        if (!code) return null;
        const s = String(code).padEnd(6, '0').slice(0, 6);
        // 省级编码：前两位 + 0000
        return s.slice(0, 2) + '0000';
    };
    const fallbackAdcode = (lat, lng) => {
        // 手动兜底的省级范围：青海、上海、浙江、北京、吉林、河南、江苏
        if (lat > 35 && lat < 37 && lng > 100 && lng < 102) return '630000'; // Qinghai (Xining)
        if (lat > 30 && lat < 32.2 && lng > 120 && lng < 122.5) return '310000'; // Shanghai
        if (lat > 27 && lat < 31.8 && lng > 118 && lng < 123) return '330000'; // Zhejiang
        if (lat > 39 && lat < 41.2 && lng > 115 && lng < 117.5) return '110000'; // Beijing
        if (lat > 41 && lat < 45 && lng > 123 && lng < 129) return '220000'; // Jilin
        if (lat > 33 && lat < 36 && lng > 110 && lng < 116) return '410000'; // Henan
        if (lat > 31 && lat < 35.5 && lng > 116 && lng < 122) return '320000'; // Jiangsu
        return null;
    };

    const filterState = {
        entry: true,
        photo: true,
        keydate: true
    };

    function colorForKind(kind) {
        if (kind === 'photo') return 'rgba(140,170,255,0.9)';
        if (kind === 'keydate') return '#ff003c';
        return 'rgba(255,255,255,0.9)';
    }

    const positionCounts = {};

    function getJitteredPos(lat, lng) {
        const key = Math.round(lat * 10) + ',' + Math.round(lng * 10);
        if (!positionCounts[key]) positionCounts[key] = 0;
        const count = positionCounts[key];
        positionCounts[key]++;

        if (count > 0) {
            const angle = count * 137.5 * (Math.PI / 180);
            const radius = 0.012 * Math.sqrt(count);
            const newLat = lat + radius * Math.cos(angle);
            const newLng = lng + radius * Math.sin(angle) * 1.3;
            return new AMap.LngLat(newLng, newLat);
        }
        return new AMap.LngLat(lng, lat);
    }

    function formatGeoLabel(originalLabel, lat, lng) {
        let text = originalLabel || '';
        text = text.replace(/^[\d\.\-,]+\s*/, '');
        const latNum = parseFloat(lat);
        const lngNum = parseFloat(lng);
        if (isNaN(latNum) || isNaN(lngNum)) return text;
        const latInt = Math.floor(latNum);
        const lngInt = Math.floor(lngNum);
        const coordsStr = `${latInt} ${lngInt}`;
        if (text) {
            return `${coordsStr} ${text}`;
        }
        return coordsStr;
    }

    function buildMarker(m) {
        const color = colorForKind(m.kind);
        const pos = getJitteredPos(m.lat, m.lng);

        let marker;
        if (m.kind === 'keydate') {
            marker = new AMap.Marker({
                position: pos,
                anchor: 'center',
                offset: new AMap.Pixel(0, 0),
                zIndex: 300,
                content: '<div class="keydate-pin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.35-9.33-9.27C1.2 9.08 2.5 5.5 5.73 4.6c1.9-.52 3.61.22 4.77 1.7 1.16-1.48 2.87-2.22 4.77-1.7 3.23.89 4.53 4.48 3.06 7.13C19 16.65 12 21 12 21Z"/></svg></div>',
                bubble: true,
                extData: { kind: m.kind }
            });
        } else {
            marker = new AMap.CircleMarker({
                center: pos,
                radius: 3.6,
                strokeColor: 'rgba(0,0,0,0.4)',
                strokeWeight: 0.6,
                fillColor: color,
                fillOpacity: 0.85,
                zIndex: 80,
                cursor: 'pointer',
                bubble: true,
                extData: { kind: m.kind }
            });
        }

        const displayGeo = formatGeoLabel(m.label, m.lat, m.lng);

        let contentHtml = '';
        if (m.image) {
            contentHtml += `<img src="${m.image}" class="info-img" loading="lazy">`;
        }
        let snippet = m.snippet || '';
        if (snippet.length > 60) snippet = snippet.substring(0, 60) + '...';

        contentHtml += `<div class="info-content">${snippet}</div>`;

        const html = `
            <div class="amap-info-window-custom">
                <span class="info-close" onclick="closeInfoWindow()">×</span>
                <div class="info-time">${m.timestamp}</div>
                ${contentHtml}
                <div class="info-geo">${displayGeo}</div>
            </div>
        `;

        marker.on('click', () => {
            if (currentInfoWindow) currentInfoWindow.close();
            const info = new AMap.InfoWindow({
                isCustom: true,
                content: html,
                offset: new AMap.Pixel(0, -12),
                autoMove: true
            });
            info.open(map, pos);
            currentInfoWindow = info;
        });

        marker.setMap(map);
        markerInstances.push(marker);
    }

    window.closeInfoWindow = function() {
        if (currentInfoWindow) {
            currentInfoWindow.close();
            currentInfoWindow = null;
        }
    };

    window.toggleFilter = function(type) {
        filterState[type] = !filterState[type];
        const el = document.getElementById('filter-' + type);
        if (filterState[type]) {
            el.classList.remove('is-off');
        } else {
            el.classList.add('is-off');
        }
        markerInstances.forEach(marker => {
            const k = marker.getExtData().kind;
            if (filterState[k]) {
                marker.show();
            } else {
                marker.hide();
            }
        });
    };

    // 【修复重点】使用 setZoom 配合 duration 实现平滑缩放
    window.zoomIn = function() {
        map.setZoom(map.getZoom() + 1, false, 400);
    };

    window.zoomOut = function() {
        map.setZoom(map.getZoom() - 1, false, 400);
    };

    function refreshDistrictLayer() {
        if (!districtLayer) return;
        const baseFill = 'rgba(255,255,255,0.022)';
        const visitedFill = 'rgba(255,0,60,0.1)';
        districtLayer.setStyles({
            fill: props => visitedAdcodes.has(normalizeAdcode(props.adcode)) ? visitedFill : baseFill,
            strokeColor: '#2c2c2c',
            strokeOpacity: 0.72,
            strokeWeight: 1
        });
        console.log('[Map] Visited provinces (layer):', Array.from(visitedAdcodes));
    }

    function resolveVisitedAdcodes() {
        if (!geocoder) return;
        const uniquePoints = {};
        validMarkers.forEach(m => {
            const key = `${m.lat.toFixed(2)},${m.lng.toFixed(2)}`;
            if (!uniquePoints[key]) {
                uniquePoints[key] = { lat: m.lat, lng: m.lng };
            }
        });

        Object.values(uniquePoints).forEach(pt => {
            // 先尝试兜底映射，保证一致性
            const fbEarly = fallbackAdcode(pt.lat, pt.lng);
            if (fbEarly) {
                visitedAdcodes.add(fbEarly);
            }
            geocoder.getAddress([pt.lng, pt.lat], (status, result) => {
                if (status === 'complete' && result.regeocode) {
                    const raw = result.regeocode.addressComponent?.adcode;
                    const code = normalizeAdcode(raw);
                    console.log('[Map] Geocode success', { lat: pt.lat, lng: pt.lng, rawAdcode: raw, normalized: code });
                    if (code) {
                        visitedAdcodes.add(code);
                    }
                } else {
                    console.log('[Map] Geocode failed', { lat: pt.lat, lng: pt.lng, status, result });
                }
                const fb = fallbackAdcode(pt.lat, pt.lng);
                if (fb) {
                    console.log('[Map] Fallback adcode', fb, 'for', pt);
                    visitedAdcodes.add(fb);
                }
                refreshDistrictLayer();
            });
        });
    }

    validMarkers.forEach(m => buildMarker(m));

    map.plugin(['AMap.Geocoder', 'AMap.DistrictLayer'], function () {
        geocoder = new AMap.Geocoder({ extensions: 'all' });
        districtLayer = new AMap.DistrictLayer.Province({
            adcode: '100000',
            depth: 1,
            zIndex: 5,
            styles: {
                'default': {
                    fill: 'rgba(255,255,255,0.038)',
                    strokeColor: '#2c2c2c',
                    strokeOpacity: 0.65,
                    strokeWeight: 1
                }
            }
        });
        districtLayer.setMap(map);
        refreshDistrictLayer();
        resolveVisitedAdcodes();
    });

    if (markerInstances.length > 0) {
        map.setFitView(null, false, [100, 60, 100, 60]);
    }
</script>
{% endblock %}
