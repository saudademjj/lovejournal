{% extends "base.html" %}
{% block content %}
<style>
    main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 120px 2rem 80px;
        position: relative;
        z-index: 2;
    }

    #map {
        width: 100%;
        height: calc(100vh - 180px);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0,0,0,0.9);
        border: 1px solid rgba(255,255,255,0.06);
    }

    .map-legend {
        position: absolute;
        top: 140px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        padding: 0.65rem 1.2rem;
        border-radius: 999px;
        background: rgba(5,5,5,0.82);
        border: 1px solid rgba(255,255,255,0.08);
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 1rem;
        box-shadow: 0 18px 40px rgba(0,0,0,0.7);
    }

    .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.05);
    }

    .map-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
    }
    .map-dot.entry { background: #ffffff; box-shadow: 0 0 0 2px rgba(255,255,255,0.1); }
    .map-dot.photo { background: var(--neon-blue); box-shadow: 0 0 0 2px rgba(43,0,255,0.16); }
    .map-dot.keydate { background: var(--neon-pink); box-shadow: 0 0 0 2px rgba(255,0,60,0.18); }

    @media (max-width: 768px) {
        main { padding: 120px 1.2rem 60px; }
        #map { height: calc(100vh - 160px); }
        .map-legend {
            left: 1.4rem;
            right: 1.4rem;
            justify-content: center;
        }
    }
</style>

<div class="map-legend" aria-label="Legend for map markers">
    <span class="legend-item"><span class="map-dot entry"></span>TEXT</span>
    <span class="legend-item"><span class="map-dot photo"></span>PHOTO</span>
    <span class="legend-item"><span class="map-dot keydate"></span>DATE</span>
</div>

<main aria-label="Map of memories">
    <div id="map"></div>
</main>

<script>
    // 高德 JSAPI 2.0 安全配置
    window._AMapSecurityConfig = {
        securityJsCode: '9a6053273e69e199acb91aae8add03c9'
    };
</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=7432049c00644e7496cd0151d59380c9&plugin=AMap.HeatMap"></script>

<script>
    // 【修复1】直接使用 Jinja2 输出 JSON 对象，不要用单引号包裹和 JSON.parse
    const markersData = JSON.parse('{{ markers|tojson|safe }}' || '[]');

    const map = new AMap.Map('map', {
        viewMode: '2D',
        zoom: 4,
        center: [104.06, 30.67],
        mapStyle: 'amap://styles/dark',
        pitch: 0
    });

    const validMarkers = markersData.filter(m => m.lat !== null && m.lng !== null);
    let markerCount = 0;

    function colorForKind(kind) {
        if (kind === 'photo') return '#2b00ff';
        if (kind === 'keydate') return '#ff003c';
        return '#ffffff';
    }

    // 热力图数据
    const heatData = [];
    let heatmap = null;

    // 用于记录坐标点，避免完全重合
    const seenPositions = new Set();

    map.plugin(['AMap.HeatMap'], function () {
        heatmap = new AMap.HeatMap(map, {
            radius: 25,
            opacity: [0, 0.8],
        });
        // 初始化加载热力图
        if(heatData.length > 0) {
            heatmap.setDataSet({ data: heatData, max: 6 });
        }
    });

    function buildMarker(m) {
        const color = colorForKind(m.kind);

        // --- 坐标扰动逻辑 (Jitter) ---
        // 检查该坐标是否已经存在，如果存在则添加微小的随机偏移
        // 0.0002 大约是 20 米左右，足够在视觉上分开
        let lat = m.lat;
        let lng = m.lng;
        // 保留4位小数作为key判定重合
        const posKey = lat.toFixed(4) + ',' + lng.toFixed(4);

        if (seenPositions.has(posKey)) {
            lat += (Math.random() - 0.5) * 0.001;
            lng += (Math.random() - 0.5) * 0.001;
        }
        seenPositions.add(posKey);

        const pos = new AMap.LngLat(lng, lat);

        const marker = new AMap.CircleMarker({
            center: pos,
            radius: 6,
            strokeColor: color,
            strokeWeight: 1,
            fillColor: color,
            fillOpacity: 0.85,
            zIndex: 10,
            cursor: 'pointer'
        });

        // 修复：使用 clean_geo 逻辑类似的简单处理，移除前端弹窗里的冗长坐标
        // 格式通常是 "31.23,121.47 Shanghai" -> 提取 "Shanghai"
        let displayLabel = m.label || '';
        // 正则替换掉开头的数字坐标
        displayLabel = displayLabel.replace(/^[\d\.\-,]+\s+/, '');
        if (!displayLabel.trim()) displayLabel = '';

        // 限制最大宽度 max-width 和 white-space，防止单行过长导致偏移
        let html = `
            <div style="min-width:180px; max-width:240px; color:#fff; white-space:normal;">
                <div style="font-family:'JetBrains Mono',monospace;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:#aaa;margin-bottom:4px;">
                    ${m.timestamp || ''}
                </div>
                <div style="font-family:'Inter',sans-serif;font-size:0.9rem;color:#fff;margin-bottom:4px;word-wrap:break-word;">
                    ${m.snippet || ''}
                </div>
                <div style="font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:#888;">
                    ${displayLabel}
                </div>
            </div>
        `;
        if (m.image) {
            html = `
                <div style="min-width:220px; max-width:260px; color:#fff; white-space:normal;">
                    <img src="${m.image}" style="width:100%;border-radius:8px;margin-bottom:6px;display:block;" />
                    ${html}
                </div>
            `;
        }

        marker.on('click', () => {
            const info = new AMap.InfoWindow({
                content: html,
                // 微调 offset，使气泡箭头更准确指向圆点
                offset: new AMap.Pixel(0, -6),
                anchor: 'bottom-center',
                isCustom: false,
                closeWhenClickMap: true,
                autoMove: true
            });
            info.open(map, pos);
        });

        // 【修复2】直接添加到地图
        marker.setMap(map);

        markerCount += 1;
        // 热力图数据尽量使用原始坐标
        heatData.push({ lng: m.lng, lat: m.lat, count: 1 });
    }

    validMarkers.forEach(m => buildMarker(m));

    // 更新热力图
    if (heatmap && heatData.length) {
        heatmap.setDataSet({ data: heatData, max: 6 });
    }

    // 【修复3】自动缩放视野以包含所有点
    if (markerCount > 0) {
        map.setFitView(null, false, [60, 60, 60, 60]);
    }
</script>
{% endblock %}
