{% extends "base.html" %}
{% block content %}
<style>
    main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 120px 2rem 80px;
        position: relative;
        z-index: 2;
    }

    #map {
        width: 100%;
        height: calc(100vh - 180px);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0,0,0,0.9);
        border: 1px solid rgba(255,255,255,0.06);
    }

    .map-legend {
        position: absolute;
        top: 140px;
        left: 2.8rem;
        z-index: 10;
        padding: 0.6rem 1rem;
        border-radius: 999px;
        background: rgba(5,5,5,0.8);
        border: 1px solid rgba(255,255,255,0.08);
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 0.7rem;
    }

    .map-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
    }
    .map-dot.entry { background: #ffffff; }
    .map-dot.photo { background: var(--neon-blue); }
    .map-dot.keydate { background: var(--neon-pink); }

    @media (max-width: 768px) {
        main { padding: 120px 1.2rem 60px; }
        #map { height: calc(100vh - 160px); }
        .map-legend {
            left: 1.4rem;
            right: 1.4rem;
            justify-content: center;
        }
    }
</style>

<div class="map-legend">
    <span class="map-dot entry"></span> TEXT
    <span class="map-dot photo"></span> PHOTO
    <span class="map-dot keydate"></span> DATE
</div>

<main aria-label="Map of memories">
    <div id="map"></div>
</main>

<script>
    // 高德 JSAPI 2.0 安全配置
    window._AMapSecurityConfig = {
        securityJsCode: '9a6053273e69e199acb91aae8add03c9'
    };
</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=7432049c00644e7496cd0151d59380c9&plugin=AMap.HeatMap"></script>

<script>
    const markersData = JSON.parse('{{ markers|tojson|safe }}' || '[]');

    const map = new AMap.Map('map', {
        viewMode: '3D',
        zoom: 4,
        center: [104.06, 30.67], // 大致中国中部
        mapStyle: 'amap://styles/dark',
        pitch: 45
    });

    const markerLayer = new AMap.OverlayGroup();
    map.add(markerLayer);

    function colorForKind(kind) {
        if (kind === 'photo') return '#2b00ff';
        if (kind === 'keydate') return '#ff003c';
        return '#ffffff';
    }

    const heatData = [];

    markersData.forEach(m => {
        const color = colorForKind(m.kind);
        const pos = new AMap.LngLat(m.lng, m.lat);

        const marker = new AMap.CircleMarker({
            center: pos,
            radius: 6,
            strokeColor: color,
            strokeWeight: 1,
            fillColor: color,
            fillOpacity: 0.85,
            zIndex: 10
        });
        let html = `
            <div style="min-width:200px;color:#fff;">
                <div style="font-family:'JetBrains Mono',monospace;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:#aaa;margin-bottom:4px;">
                    ${m.timestamp || ''}
                </div>
                <div style="font-family:'Inter',sans-serif;font-size:0.9rem;color:#fff;margin-bottom:4px;">
                    ${m.snippet || ''}
                </div>
                <div style="font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:#888;">
                    ${m.label || ''}
                </div>
            </div>
        `;
        if (m.image) {
            html = `
                <div style="min-width:220px;color:#fff;">
                    <img src="${m.image}" style="width:100%;border-radius:8px;margin-bottom:6px;" />
                    ${html}
                </div>
            `;
        }
        marker.setTitle(m.label || '');
        marker.on('click', () => {
            const info = new AMap.InfoWindow({
                content: html,
                offset: new AMap.Pixel(0, -16)
            });
            info.open(map, marker.getCenter());
        });
        markerLayer.addOverlay(marker);

        heatData.push({ lng: m.lng, lat: m.lat, count: 1 });
    });

    if (markersData.length) {
        map.setFitView(markerLayer, false, [40, 40, 40, 40]);
    }

    // 回忆热力图
    if (heatData.length) {
        map.plugin(['AMap.HeatMap'], function () {
            const heatmap = new AMap.HeatMap(map, {
                radius: 25,
                opacity: [0, 0.8],
            });
            heatmap.setDataSet({
                data: heatData,
                max: 6
            });
        });
    }
</script>
{% endblock %}
